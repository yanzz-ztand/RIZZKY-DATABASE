name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_URL: "https://anichin-beta.my.id/"
  APP_NAME: "Anichin"
  APP_ID: "id.anichin.app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate WebView project
        run: |
          mkdir -p twa && cd twa
          mkdir -p app/src/main/java/id/anichin/app

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'id.anichin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "id.anichin.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__NAME__"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/id/anichin/app/MainActivity.java << 'EOF'
          package id.anichin.app;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {
              private static final String URL = "__URL__";
              private WebView web;
              private ProgressBar bar;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  root = new FrameLayout(this);
                  web = new WebView(this);
                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  root.addView(bar, new FrameLayout.LayoutParams(-1, 8));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("http://") || u.startsWith("https://")) return false;
                          return true;
                      }
                      @Override
                      public void onPageStarted(WebView v, String u, Bitmap f) { bar.setVisibility(View.VISIBLE); }
                      @Override
                      public void onPageFinished(WebView v, String u) { bar.setVisibility(View.GONE); }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) { bar.setProgress(p); }
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCallback = cb;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      }
                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          if (customCallback != null) customCallback.onCustomViewHidden();
                          web.setVisibility(View.VISIBLE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  });

                  if (b != null) web.restoreState(b); else web.loadUrl(URL);
              }

              @Override
              public boolean onKeyDown(int code, KeyEvent e) {
                  if (code == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) { web.getWebChromeClient().onHideCustomView(); return true; }
                      if (web.canGoBack()) { web.goBack(); return true; }
                  }
                  return super.onKeyDown(code, e);
              }

              @Override
              protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override
              protected void onPause() { super.onPause(); web.onPause(); }
              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF

          sed -i "s|__URL__|${APP_URL}|g" app/src/main/java/id/anichin/app/MainActivity.java
          sed -i "s|__NAME__|${APP_NAME}|g" app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: twa
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anichin-APK
          path: twa/app/build/outputs/apk/debug/app-debug.apk
