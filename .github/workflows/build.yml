name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_URL: "https://anichin-beta.my.id/"
  APP_NAME: "Anichin"
  APP_ID: "id.anichin.app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate WebView project
        run: |
          mkdir -p twa && cd twa
          mkdir -p app/src/main/java/id/anichin/app

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'id.anichin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "id.anichin.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__NAME__"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                android:largeHeap="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_red">#E53935</color>
              <color name="ic_yellow">#FFD600</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_fg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path
                  android:pathData="M36,76 L54,32 L72,76"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFD600"
                  android:strokeWidth="9"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="miter" />
              <path
                  android:pathData="M43,64 L65,64"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFD600"
                  android:strokeWidth="9"
                  android:strokeLineCap="round" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_red" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path
                  android:pathData="M24,6 L84,6 Q102,6 102,24 L102,84 Q102,102 84,102 L24,102 Q6,102 6,84 L6,24 Q6,6 24,6 Z"
                  android:fillColor="#E53935" />
              <path
                  android:pathData="M36,76 L54,32 L72,76"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFD600"
                  android:strokeWidth="9"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="miter" />
              <path
                  android:pathData="M43,64 L65,64"
                  android:fillColor="#00000000"
                  android:strokeColor="#FFD600"
                  android:strokeWidth="9"
                  android:strokeLineCap="round" />
          </vector>
          EOF

          cat > app/src/main/java/id/anichin/app/MainActivity.java << 'EOF'
          package id.anichin.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.content.res.Configuration;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageButton;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {
              private static final String URL = "__URL__";
              private static final String FAST_CSS =
                  "(function(){if(document.getElementById('__fast'))return;"
                  + "var s=document.createElement('style');s.id='__fast';"
                  + "s.textContent='*{transition-duration:.1s !important;transition-delay:0s !important;"
                  + "scroll-behavior:auto !important}';"
                  + "(document.head||document.documentElement).appendChild(s);})();";
              private WebView web;
              private ProgressBar bar;
              private FrameLayout root;
              private ImageButton rotateBtn, fsBtn;
              private SharedPreferences prefs;
              private float density;
              private boolean landscape = false;
              private boolean fullscreen = false;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  density = getResources().getDisplayMetrics().density;
                  prefs = getSharedPreferences("ui", MODE_PRIVATE);
                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  maxRefreshRate();

                  root = new FrameLayout(this);
                  web = new WebView(this);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));

                  bar = new ProgressBar(this);
                  bar.setIndeterminateTintList(ColorStateList.valueOf(Color.parseColor("#1E88E5")));
                  root.addView(bar, new FrameLayout.LayoutParams((int) (48 * density), (int) (48 * density), Gravity.CENTER));

                  rotateBtn = makeFab(android.R.drawable.ic_menu_rotate, "rot", 0.97f, 0.78f, () -> {
                      landscape = !landscape;
                      setRequestedOrientation(landscape
                          ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          : ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT);
                  });
                  fsBtn = makeFab(android.R.drawable.ic_menu_view, "fs", 0.97f, 0.62f, this::toggleFullscreen);

                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setDatabaseEnabled(true);
                  s.setOffscreenPreRaster(true);
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          return !(u.startsWith("http://") || u.startsWith("https://"));
                      }
                      @Override
                      public void onPageStarted(WebView v, String u, Bitmap f) { bar.setVisibility(View.VISIBLE); }
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          bar.setVisibility(View.GONE);
                          v.evaluateJavascript(FAST_CSS, null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCallback = cb;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                          rotateBtn.bringToFront();
                          fsBtn.bringToFront();
                          applyImmersive(true);
                      }
                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          if (customCallback != null) customCallback.onCustomViewHidden();
                          web.setVisibility(View.VISIBLE);
                          applyImmersive(fullscreen);
                      }
                  });

                  if (saved != null) web.restoreState(saved); else web.loadUrl(URL);

                  root.post(() -> setFullscreen(
                      getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE));
              }

              // Pakai refresh rate tertinggi layar (90/120Hz) biar animasi mulus
              private void maxRefreshRate() {
                  if (Build.VERSION.SDK_INT < 23) return;
                  try {
                      Display d = getWindowManager().getDefaultDisplay();
                      Display.Mode cur = d.getMode();
                      Display.Mode best = cur;
                      for (Display.Mode m : d.getSupportedModes()) {
                          if (m.getPhysicalWidth() == cur.getPhysicalWidth()
                              && m.getPhysicalHeight() == cur.getPhysicalHeight()
                              && m.getRefreshRate() > best.getRefreshRate()) best = m;
                      }
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.preferredDisplayModeId = best.getModeId();
                      getWindow().setAttributes(lp);
                  } catch (Exception ignored) { }
              }

              // Tombol melayang yang bisa digeser (posisi tersimpan)
              private ImageButton makeFab(int icon, final String key, final float defX, final float defY, final Runnable click) {
                  final ImageButton btn = new ImageButton(this);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(Color.parseColor("#CC1E88E5"));
                  btn.setBackground(bg);
                  btn.setImageResource(icon);
                  btn.setColorFilter(Color.WHITE);
                  btn.setAlpha(0.75f);
                  int size = (int) (44 * density);
                  root.addView(btn, new FrameLayout.LayoutParams(size, size, Gravity.TOP | Gravity.START));
                  makeDraggable(btn, key, click);
                  root.addOnLayoutChangeListener((vw, l1, t1, r1, b1, l2, t2, r2, b2) -> applyPos(btn, key, defX, defY));
                  return btn;
              }

              private void applyPos(View v, String key, float defX, float defY) {
                  float maxX = Math.max(0, root.getWidth() - v.getWidth());
                  float maxY = Math.max(0, root.getHeight() - v.getHeight());
                  v.setX(prefs.getFloat(key + "_x", defX) * maxX);
                  v.setY(prefs.getFloat(key + "_y", defY) * maxY);
              }

              private void makeDraggable(View v, final String key, final Runnable click) {
                  final int slop = ViewConfiguration.get(this).getScaledTouchSlop();
                  v.setOnTouchListener(new View.OnTouchListener() {
                      float offX, offY, startX, startY;
                      boolean moved;
                      @Override
                      public boolean onTouch(View view, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  offX = view.getX() - e.getRawX();
                                  offY = view.getY() - e.getRawY();
                                  startX = e.getRawX();
                                  startY = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (!moved && Math.hypot(e.getRawX() - startX, e.getRawY() - startY) > slop) moved = true;
                                  if (moved) {
                                      float maxX = Math.max(0, root.getWidth() - view.getWidth());
                                      float maxY = Math.max(0, root.getHeight() - view.getHeight());
                                      view.setX(Math.min(maxX, Math.max(0, e.getRawX() + offX)));
                                      view.setY(Math.min(maxY, Math.max(0, e.getRawY() + offY)));
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (moved) {
                                      float maxX = Math.max(1, root.getWidth() - view.getWidth());
                                      float maxY = Math.max(1, root.getHeight() - view.getHeight());
                                      prefs.edit()
                                          .putFloat(key + "_x", view.getX() / maxX)
                                          .putFloat(key + "_y", view.getY() / maxY)
                                          .apply();
                                  } else {
                                      click.run();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });
              }

              @SuppressWarnings("deprecation")
              private void applyImmersive(boolean on) {
                  Window w = getWindow();
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = on
                          ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT;
                      w.setAttributes(lp);
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(!on);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          if (on) {
                              c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                              c.hide(WindowInsets.Type.systemBars());
                          } else {
                              c.show(WindowInsets.Type.systemBars());
                          }
                      }
                  } else {
                      w.getDecorView().setSystemUiVisibility(on
                          ? (View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                             | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                             | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
                          : View.SYSTEM_UI_FLAG_VISIBLE);
                  }
              }

              private void setFullscreen(boolean on) {
                  fullscreen = on;
                  applyImmersive(on);
                  fsBtn.setImageResource(on
                      ? android.R.drawable.ic_menu_close_clear_cancel
                      : android.R.drawable.ic_menu_view);
              }

              private void toggleFullscreen() { setFullscreen(!fullscreen); }

              // Otomatis full layar saat landscape, normal saat portrait
              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  setFullscreen(newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersive(fullscreen || customView != null);
              }

              @Override
              public boolean onKeyDown(int code, KeyEvent e) {
                  if (code == KeyEvent.KEYCODE_BACK) {
                      if (customView != null) { web.getWebChromeClient().onHideCustomView(); return true; }
                      if (web.canGoBack()) { web.goBack(); return true; }
                  }
                  return super.onKeyDown(code, e);
              }

              @Override
              protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override
              protected void onPause() { super.onPause(); web.onPause(); }
              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF

          sed -i "s|__URL__|${APP_URL}|g" app/src/main/java/id/anichin/app/MainActivity.java
          sed -i "s|__NAME__|${APP_NAME}|g" app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: twa
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anichin-APK
          path: twa/app/build/outputs/apk/debug/app-debug.apk
