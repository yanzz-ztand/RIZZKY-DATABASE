<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rizzxy Admin</title>
<style>
  :root { --bg:#0b0714; --card:#1a1030; --line:#4c2a7a; --txt:#ede9fe; --mut:#a59bc4; --acc:#a855f7; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--txt); font:14px system-ui,sans-serif; }
  h1 { font-size:16px; letter-spacing:.08em; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  input { width:100%; padding:10px; margin:4px 0; border-radius:10px; border:1px solid var(--line); background:#130b24; color:var(--txt); font-size:14px; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  button { padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#3b1a66; color:var(--txt); font-weight:700; font-size:12px; }
  button.main { background:var(--acc); color:#1e0b3a; width:100%; padding:11px; margin-top:6px; }
  .tok { font-family:monospace; font-size:14px; font-weight:700; word-break:break-all; }
  .meta { color:var(--mut); font-size:12px; margin:4px 0 8px; }
  button.del { background:#4a1020; border-color:#8a2a45; margin-left:6px; }
  .btns { display:flex; gap:6px; }
  .btns button { flex:0 0 auto; }
  #msg { color:var(--mut); font-size:12px; min-height:16px; margin:4px 0; }
</style>
</head>
<body>
<h1>RIZZXY ADMIN</h1>

<div class="card">
  <input id="key" type="password" placeholder="Admin key" autocomplete="off">
  <div class="row">
    <input id="days" type="number" min="0" placeholder="Hari (0 = tanpa batas)">
    <input id="dev" placeholder="ID perangkat (opsional)">
  </div>
  <input id="note" placeholder="Catatan (nama pembeli)">
  <button class="main" onclick="make()">BUAT TOKEN</button>
  <div id="msg"></div>
</div>

<div id="list"></div>

<div id="rev"></div>

<div class="meta">Riwayat hanya tersimpan di browser ini. Tombol Hapus membuang token dari riwayat dan memasukkan ID-nya ke daftar REVOKED di bawah. Agar token benar-benar mati, tempel daftar itu ke env REVOKED di Vercel lalu deploy ulang.</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let hist = [];
try { hist = JSON.parse(localStorage.getItem('rzx_hist') || '[]'); } catch (e) {}
let rev = [];
try { rev = JSON.parse(localStorage.getItem('rzx_rev') || '[]'); } catch (e) {}
function save() {
  try { localStorage.setItem('rzx_hist', JSON.stringify(hist)); localStorage.setItem('rzx_rev', JSON.stringify(rev)); } catch (e) {}
}

function fmt(ms) {
  return ms ? new Date(ms).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : 'tanpa batas';
}

function render() {
  $('list').innerHTML = hist.map((h, i) => `<div class="card">
    <div class="tok">${esc(h.token)}</div>
    <div class="meta">ID: ${esc(h.id)} · exp: ${fmt(h.exp)}${h.dev ? ' · HP: ' + esc(h.dev) : ''}${h.note ? ' · ' + esc(h.note) : ''}</div>
    <div class="btns"><button onclick="copyTok(${i})">Salin</button><button class="del" onclick="del(${i})">Hapus</button></div>
  </div>`).join('');
  renderRev();
}

function renderRev() {
  $('rev').innerHTML = rev.length ? `<div class="card">
    <div class="meta">REVOKED (tempel ke env Vercel, lalu deploy ulang)</div>
    <div class="tok">${esc(rev.join(','))}</div>
    <div class="btns" style="margin-top:8px"><button onclick="copyRev()">Salin daftar</button><button class="del" onclick="clearRev()">Kosongkan</button></div>
  </div>` : '';
}

function del(i) {
  const h = hist[i];
  if (!h || !confirm('Hapus token ' + h.id + '? ID-nya masuk daftar REVOKED.')) return;
  hist.splice(i, 1);
  if (!rev.includes(h.id)) rev.push(h.id);
  save();
  $('msg').textContent = 'Dihapus. Tempel daftar REVOKED ke Vercel agar token mati.';
  render();
}

function copyRev() { navigator.clipboard.writeText(rev.join(',')); $('msg').textContent = 'Daftar REVOKED disalin'; }
function clearRev() { if (confirm('Kosongkan daftar REVOKED di browser ini?')) { rev = []; save(); render(); } }

function copyTok(i) { navigator.clipboard.writeText(hist[i].token); $('msg').textContent = 'Disalin'; }

async function make() {
  const dev = $('dev').value.trim();
  const r = await fetch('/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': $('key').value.trim() },
    body: JSON.stringify({ days: $('days').value, device: dev }),
  });
  const j = await r.json().catch(() => ({ ok: false, reason: 'Respons tidak valid' }));
  if (!j.ok) { $('msg').textContent = j.reason; return; }
  hist.unshift({ token: j.token, id: j.id, exp: j.exp, dev, note: $('note').value.trim() });
  save();
  $('msg').textContent = 'Token dibuat';
  render();
}
render();
</script>
</body>
</html>
